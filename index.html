<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>股票新闻助手</title>
<script src="https://cdn.bootcdn.net/ajax/libs/echarts/5.4.3/echarts.min.js"></script>
<style>
  :root {
    --bg: #f5f6fa; --card: #ffffff; --text: #1a1d26; --muted: #8a90a2;
    --border: #e8eaf0; --accent: #4f46e5; --accent-soft: #eef2ff;
    --up: #e03131; --up-soft: #fdecec; --down: #2f9e44; --down-soft: #e9f7ee;
    --gray-soft: #f0f1f5; --shadow: 0 4px 16px rgba(30,41,59,.06);
  }
  [data-theme="dark"] {
    --bg: #0f1115; --card: #1a1d24; --text: #e6e8ee; --muted: #8b90a0;
    --border: #2a2e37; --accent: #6366f1; --accent-soft: #242a45;
    --up: #f05252; --up-soft: #3a2326; --down: #3ecf6a; --down-soft: #1e3327;
    --gray-soft: #22252d; --shadow: 0 4px 16px rgba(0,0,0,.4);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.6;
    transition: background .2s, color .2s;
  }
  .header {
    position: sticky; top: 0; z-index: 20;
    background: color-mix(in srgb, var(--card) 90%, transparent);
    backdrop-filter: blur(8px); border-bottom: 1px solid var(--border);
    padding: 14px 26px; display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  .header h1 { font-size: 19px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  .header .logo { font-size: 22px; }
  .header .sub { font-size: 12px; color: var(--muted); font-weight: 400; margin-left: 2px; }
  .header-right { display: flex; align-items: center; gap: 8px; }
  .btn {
    border: none; cursor: pointer; font-size: 14px; font-weight: 600;
    padding: 9px 16px; border-radius: 8px; transition: all .15s; font-family: inherit;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { filter: brightness(1.1); }
  .btn-primary:disabled { opacity: .5; cursor: not-allowed; }
  .icon-btn {
    background: var(--gray-soft); color: var(--text); border: none; cursor: pointer;
    width: 38px; height: 38px; border-radius: 9px; font-size: 17px;
  }
  .icon-btn:hover { background: var(--border); }
  .auto-switch { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); cursor: pointer; user-select: none; }
  .auto-switch input { display: none; }
  .auto-switch .track {
    width: 34px; height: 20px; background: var(--border); border-radius: 20px;
    position: relative; transition: background .2s; flex-shrink: 0;
  }
  .auto-switch .track::after {
    content: ''; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px;
    background: #fff; border-radius: 50%; transition: left .2s;
  }
  .auto-switch input:checked + .track { background: var(--accent); }
  .auto-switch input:checked + .track::after { left: 16px; }
  .header-right select {
    border: 1px solid var(--border); border-radius: 8px; padding: 6px 6px;
    font-size: 12px; background: var(--card); color: var(--muted); cursor: pointer; outline: none;
  }

  .container { max-width: 900px; margin: 0 auto; padding: 20px 18px 70px; }

  /* 大盘指数栏 */
  .index-bar {
    display: flex; gap: 10px; margin-bottom: 18px; flex-wrap: wrap;
  }
  .index-item {
    flex: 1; min-width: 120px; background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 12px 16px;
  }
  .index-item .name { font-size: 12px; color: var(--muted); }
  .index-item .val { font-size: 18px; font-weight: 700; margin: 2px 0; font-variant-numeric: tabular-nums; }
  .index-item .chg { font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .up { color: var(--up); }
  .down { color: var(--down); }
  .flat { color: var(--muted); }

  /* 自选股 */
  .watchlist { margin-bottom: 16px; }
  .section-title { font-size: 13px; color: var(--muted); margin-bottom: 9px; font-weight: 600; display: flex; align-items: center; justify-content: space-between; }
  .stock-cards { display: flex; gap: 10px; flex-wrap: wrap; }
  .stock-card {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 10px 14px; cursor: pointer; min-width: 140px; transition: all .15s; position: relative;
  }
  .stock-card:hover { box-shadow: var(--shadow); border-color: var(--accent); }
  .stock-card.active { border-color: var(--accent); background: var(--accent-soft); }
  .stock-card .nm { font-size: 14px; font-weight: 600; }
  .stock-card .cd { font-size: 11px; color: var(--muted); }
  .stock-card .pc { font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; margin-top: 2px; }
  .stock-card .chg { font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .stock-card .x {
    position: absolute; top: 6px; right: 9px; font-size: 13px; color: var(--muted);
    opacity: 0; cursor: pointer; transition: opacity .15s;
  }
  .stock-card:hover .x { opacity: 1; }
  .chart-btn {
    position: absolute; top: 6px; right: 26px; font-size: 13px;
    opacity: 0; cursor: pointer; transition: opacity .15s;
  }
  .stock-card:hover .chart-btn { opacity: 1; }
  .stock-card .val { font-size: 11px; color: var(--muted); margin-top: 3px; }

  /* 财联社电报 */
  .telegraph { margin-bottom: 18px; }
  .tg-head { cursor: pointer; user-select: none; }
  .tg-arrow { transition: transform .2s; display: inline-block; }
  .telegraph.collapsed .tg-arrow { transform: rotate(-90deg); }
  .telegraph.collapsed .tg-list { display: none; }
  .tg-list {
    max-height: 520px; overflow-y: auto; background: var(--card);
    border: 1px solid var(--border); border-radius: 12px; padding: 4px 0;
  }
  .tg-item { padding: 7px 14px; font-size: 13px; border-bottom: 1px solid var(--border); display: flex; gap: 8px; align-items: baseline; }
  .tg-item:last-child { border-bottom: none; }
  .tg-time { color: var(--muted); font-size: 11px; flex-shrink: 0; font-variant-numeric: tabular-nums; }
  .tg-title { color: var(--text); line-height: 1.5; }

  /* 添加自选股（带搜索） */
  .add-stock { position: relative; margin-top: 10px; }
  .add-stock input {
    width: 100%; border: 1px solid var(--border); border-radius: 10px;
    padding: 9px 14px; font-size: 13px; background: var(--card); color: var(--text); outline: none;
  }
  .add-stock input:focus { border-color: var(--accent); }
  .search-dropdown {
    position: absolute; top: 100%; left: 0; right: 0; z-index: 15;
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    max-height: 260px; overflow-y: auto; display: none; box-shadow: var(--shadow);
  }
  .search-dropdown.show { display: block; }
  .search-item { padding: 8px 14px; cursor: pointer; font-size: 13px; display: flex; justify-content: space-between; }
  .search-item:hover { background: var(--accent-soft); }
  .search-item .sname { font-weight: 600; }
  .search-item .scode { color: var(--muted); }

  /* 工具栏 */
  .toolbar { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; align-items: center; }
  .toolbar input, .toolbar select {
    border: 1px solid var(--border); border-radius: 9px; padding: 8px 12px;
    font-size: 13px; background: var(--card); color: var(--text); outline: none;
  }
  .toolbar input { flex: 1; min-width: 160px; }
  .toolbar select { cursor: pointer; }
  .toolbar input:focus, .toolbar select:focus { border-color: var(--accent); }

  .status-bar { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); margin-bottom: 12px; min-height: 20px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #cbd5e1; }
  .dot.active { background: var(--accent); animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: .3; } }

  /* 新闻卡片 */
  .news-card {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 16px 18px; margin-bottom: 12px; transition: box-shadow .15s;
  }
  .news-card:hover { box-shadow: var(--shadow); }
  .news-top { display: flex; align-items: flex-start; gap: 10px; }
  .stock-tag {
    flex-shrink: 0; background: var(--gray-soft); color: var(--muted);
    font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 6px; margin-top: 2px;
  }
  .news-title { font-size: 15px; font-weight: 600; flex: 1; }
  .news-meta { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .news-meta a { color: var(--accent); text-decoration: none; }
  .news-content {
    font-size: 13px; color: var(--muted); margin-top: 8px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .news-content.expanded { -webkit-line-clamp: unset; display: block; }
  .news-actions { display: flex; gap: 8px; margin-top: 12px; align-items: center; }
  .link-btn { font-size: 12px; color: var(--accent); cursor: pointer; background: none; border: none; font-family: inherit; }
  .btn-analyze {
    background: var(--accent-soft); color: var(--accent);
    border: none; padding: 6px 14px; border-radius: 7px; cursor: pointer; font-size: 13px; font-weight: 600; font-family: inherit;
  }
  .btn-analyze:hover { filter: brightness(.96); }
  .btn-analyze:disabled { opacity: .5; cursor: not-allowed; }
  .btn-debate {
    background: color-mix(in srgb, #f59e0b 12%, transparent); color: #d97706;
    border: none; padding: 6px 14px; border-radius: 7px; cursor: pointer; font-size: 13px; font-weight: 600; font-family: inherit;
  }
  [data-theme="dark"] .btn-debate { color: #fbbf24; }
  .btn-debate:hover { filter: brightness(.96); }
  .btn-debate:disabled { opacity: .5; cursor: not-allowed; }

  .analysis { margin-top: 12px; padding: 14px; border-radius: 10px; background: var(--gray-soft); display: none; }
  .analysis.show { display: block; }
  .sentiment-badge, .action-badge {
    display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 10px; border-radius: 20px;
  }
  .sentiment-利好, .action-买入 { background: var(--up-soft); color: var(--up); }
  .sentiment-利空, .action-卖出 { background: var(--down-soft); color: var(--down); }
  .sentiment-中性, .sentiment-未知, .action-观望 { background: var(--gray-soft); color: var(--muted); }
  .analysis .plain { font-size: 14px; margin-top: 8px; }
  .analysis .impact { font-size: 13px; color: var(--muted); margin-top: 6px; }
  .analysis .impact b { color: var(--text); }

  .debate { margin-top: 12px; padding: 12px; border-radius: 10px; background: var(--gray-soft); display: none; }
  .debate.show { display: block; }
  .debate .bull { background: var(--up-soft); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; }
  .debate .bear { background: var(--down-soft); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; }
  .debate .bull .h { color: var(--up); font-weight: 700; font-size: 13px; margin-bottom: 4px; }
  .debate .bear .h { color: var(--down); font-weight: 700; font-size: 13px; margin-bottom: 4px; }
  .debate .view { font-size: 13px; white-space: pre-line; }
  .debate .verdict { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 12px; }
  .debate .verdict .h { font-weight: 700; font-size: 13px; margin-bottom: 8px; }

  .load-more { display: block; margin: 16px auto 0; background: var(--gray-soft); color: var(--text); border: none; padding: 10px 24px; border-radius: 9px; cursor: pointer; font-size: 14px; font-family: inherit; }
  .load-more:hover { background: var(--border); }

  .empty { text-align: center; color: var(--muted); padding: 60px 0; font-size: 14px; }
  .empty .big { font-size: 40px; margin-bottom: 12px; }

  /* 标签页 */
  .tabs { display: flex; gap: 2px; padding: 0 26px; border-bottom: 1px solid var(--border); background: var(--card); }
  .tab { border: none; background: none; padding: 12px 16px; font-size: 14px; font-weight: 600; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; font-family: inherit; }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
  .tab .badge { background: var(--accent); color: #fff; font-size: 11px; border-radius: 10px; padding: 1px 7px; margin-left: 4px; }

  /* 草稿箱 */
  .draft-controls { display: flex; gap: 10px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
  .draft-controls select { border: 1px solid var(--border); border-radius: 8px; padding: 7px 10px; font-size: 13px; background: var(--card); color: var(--text); }
  .draft-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 12px; }
  .draft-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 10px; }
  .draft-src { font-size: 12px; color: var(--muted); flex: 1; }
  .draft-src a { color: var(--accent); }
  .draft-actions { display: flex; gap: 6px; flex-shrink: 0; }
  .draft-text { font-size: 14px; white-space: pre-wrap; background: var(--gray-soft); border-radius: 8px; padding: 12px; max-height: 260px; overflow-y: auto; line-height: 1.7; }
  .btn-small { border: none; border-radius: 7px; padding: 5px 12px; font-size: 12px; font-weight: 600; cursor: pointer; font-family: inherit; }
  .btn-copy { background: var(--accent-soft); color: var(--accent); }
  .btn-del { background: var(--gray-soft); color: var(--muted); }
  .draft-check { flex-shrink: 0; margin-top: 3px; width: 16px; height: 16px; cursor: pointer; }
  .tg-link { color: var(--accent); font-size: 11px; flex-shrink: 0; text-decoration: none; }
  .tg-gen { margin-left: auto; flex-shrink: 0; border: none; background: var(--accent-soft); color: var(--accent); border-radius: 6px; padding: 3px 9px; font-size: 12px; cursor: pointer; white-space: nowrap; font-family: inherit; }
  .tg-gen:disabled { opacity: .5; cursor: not-allowed; }

  /* K线弹窗 */
  .modal-mask {
    position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 40;
    display: none; align-items: center; justify-content: center; padding: 20px;
  }
  .modal-mask.show { display: flex; }
  .modal {
    background: var(--card); border-radius: 14px; width: 100%; max-width: 760px;
    padding: 18px; box-shadow: 0 20px 60px rgba(0,0,0,.3);
  }
  .modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .modal-head .t { font-size: 16px; font-weight: 700; }
  .modal-head .close { background: none; border: none; font-size: 22px; color: var(--muted); cursor: pointer; }
  #klineChart { width: 100%; height: 420px; }
</style>
</head>
<body>
  <div class="header">
    <h1><span class="logo">📈</span>股票新闻助手 <span class="sub">行情 · 新闻 · 大白话解读</span></h1>
    <div class="header-right">
      <label class="auto-switch" title="定时自动抓取自选股新闻">
        <input type="checkbox" id="autoRefreshCheck" onchange="toggleAutoRefresh()">
        <span class="track"></span>
        <span>自动刷新</span>
      </label>
      <select id="autoInterval" onchange="changeInterval()" title="刷新间隔">
        <option value="1">1分钟</option>
        <option value="3">3分钟</option>
        <option value="5" selected>5分钟</option>
        <option value="10">10分钟</option>
      </select>
      <button class="icon-btn" id="themeBtn" onclick="toggleTheme()" title="切换主题">🌙</button>
      <button class="btn btn-primary" id="btnFetch" onclick="fetchNews()">🔄 刷新新闻</button>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" id="tabBtnNews" onclick="switchTab('news', this)">📰 新闻</button>
    <button class="tab" id="tabBtnDrafts" onclick="switchTab('drafts', this)">📝 草稿箱 <span class="badge" id="draftBadge" style="display:none"></span></button>
  </div>

  <div class="container">
    <div id="tab-news">
    <div class="index-bar" id="indexBar"><div class="index-item"><div class="name">加载中...</div></div></div>

    <div class="telegraph">
      <div class="section-title tg-head" onclick="toggleTelegraph()">📡 财联社电报 · 实时快讯 <span class="tg-arrow" id="tgArrow">▼</span></div>
      <div class="tg-list" id="telegraphList"><div class="tg-item">加载中...</div></div>
    </div>

    <div class="watchlist">
      <div class="section-title"><span>我的自选股 <span style="color:var(--muted);font-weight:400;">（点击筛选 · 点右上角 × 删除 · 点卡片看K线）</span></span></div>
      <div class="stock-cards" id="stockCards"></div>
      <div class="add-stock">
        <input id="stockInput" placeholder="🔍 输入股票代码或名称添加自选，如 600519 / 茅台" autocomplete="off" />
        <div class="search-dropdown" id="searchDropdown"></div>
      </div>
    </div>

    <div class="toolbar">
      <input id="kwInput" placeholder="🔍 搜索新闻关键词..." oninput="applyFilter()" />
      <select id="srcSelect" onchange="applyFilter()"><option value="">全部来源</option></select>
    </div>

    <div class="status-bar" id="statusBar"><span class="dot" id="statusDot"></span><span id="statusText">就绪</span></div>

    <div id="newsList"></div>
    <button class="load-more" id="loadMore" onclick="loadMore()" style="display:none;">加载更多</button>
    </div>

    <div id="tab-drafts" style="display:none;">
      <div class="draft-controls">
        <span style="font-size:13px;color:var(--muted);">在「新闻」页点快讯后的「✍️ 生成草稿」按钮，按需生成单条草稿</span>
        <span style="flex:1"></span>
        <label class="auto-switch">
          <input type="checkbox" id="selectAllCheck" onchange="toggleSelectAll()">
          <span class="track"></span>
          <span>全选</span>
        </label>
        <button class="btn-small btn-del" id="btnBatchDelete" onclick="batchDelete()" style="display:none;">🗑 删除选中(<span id="selCount">0</span>)</button>
      </div>
      <div id="draftList"></div>
    </div>
  </div>

  <!-- K线弹窗 -->
  <div class="modal-mask" id="klineMask" onclick="if(event.target===this)closeKline()">
    <div class="modal">
      <div class="modal-head"><span class="t" id="klineTitle">K线</span><button class="close" onclick="closeKline()">×</button></div>
      <div id="klineChart"></div>
    </div>
  </div>

<script>
const $ = id => document.getElementById(id);
let allNews = [];
let newsOffset = 0;
const PAGE = 30;
let activeStock = '';
let watchlistCodes = [];
let klineChart = null;
let quoteMap = {};

function escapeHtml(s){return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function chgClass(v){ return v>0?'up':(v<0?'down':'flat'); }
function fmtChg(v){ return (v>0?'+':'')+v; }
function sentimentClass(s){ return s==='利好'||s==='利空'?'sentiment-'+s:'sentiment-中性'; }

/* ---------- 主题 ---------- */
function toggleTheme(){
  const cur = document.body.getAttribute('data-theme');
  const next = cur === 'dark' ? '' : 'dark';
  document.body.setAttribute('data-theme', next);
  localStorage.setItem('theme', next);
  $('themeBtn').textContent = next==='dark' ? '☀️' : '🌙';
}
(function(){ if(localStorage.getItem('theme')==='dark'){ document.body.setAttribute('data-theme','dark'); $('themeBtn').textContent='☀️'; } })();

/* ---------- 大盘指数 ---------- */
async function loadMarket(){
  try{
    const res = await fetch('/api/market');
    const data = await res.json();
    if(!Array.isArray(data)) return;
    $('indexBar').innerHTML = data.map(i=>`
      <div class="index-item">
        <div class="name">${escapeHtml(i.name)}</div>
        <div class="val ${chgClass(i.change_pct)}">${i.price.toFixed(2)}</div>
        <div class="chg ${chgClass(i.change_pct)}">${fmtChg(i.change_pct)}%</div>
      </div>`).join('');
  }catch(e){ $('indexBar').innerHTML='<div class="index-item"><div class="name">指数加载失败</div></div>'; }
}

/* ---------- 自选股 + 行情 ---------- */
async function loadWatchlist(){
  const res = await fetch('/api/watchlist');
  watchlistCodes = await res.json();
  await loadQuotes();
}
async function loadQuotes(){
  if(!watchlistCodes.length){ $('stockCards').innerHTML=''; return; }
  try{
    const res = await fetch('/api/quotes');
    const quotes = await res.json();
    quoteMap = {};
    quotes.forEach(q=>{ if(q) quoteMap[q.code]=q; });
    $('stockCards').innerHTML = quotes.map(q=>{
      if(!q) return '';
      const active = activeStock===q.code ? 'active' : '';
      const pe = q.pe_ttm > 0 ? 'PE '+q.pe_ttm.toFixed(1) : (q.pe_ttm < 0 ? 'PE亏损' : '');
      const pb = q.pb > 0 ? 'PB '+q.pb.toFixed(2) : '';
      const mcap = q.mcap_yi > 0 ? q.mcap_yi.toFixed(0)+'亿' : '';
      const valLine = [pe, pb, mcap].filter(Boolean).join(' · ');
      return `<div class="stock-card ${active}" onclick="filterByStock('${q.code}', this)">
        <span class="x" onclick="event.stopPropagation();removeStock('${q.code}')">×</span>
        <span class="chart-btn" onclick="event.stopPropagation();showKline('${q.code}')" title="看K线">📊</span>
        <div class="nm">${escapeHtml(q.name)}</div>
        <div class="cd">${q.code}</div>
        <div class="pc ${chgClass(q.change_pct)}">${q.price.toFixed(2)}</div>
        <div class="chg ${chgClass(q.change_pct)}">${fmtChg(q.change_pct)}%</div>
        ${valLine ? `<div class="val">${valLine}</div>` : ''}
      </div>`;
    }).join('');
  }catch(e){ $('stockCards').innerHTML='<div style="color:var(--muted);font-size:13px;">行情加载失败</div>'; }
}
/* ---------- 财联社电报 ---------- */
function toggleTelegraph(){
  document.querySelector('.telegraph').classList.toggle('collapsed');
}
async function loadTelegraph(){
  try{
    const res = await fetch('/api/telegraph');
    const list = await res.json();
    if(!Array.isArray(list) || !list.length) return;
    telegraphData = list;
    $('telegraphList').innerHTML = list.slice(0, 50).map((n, i) =>
      `<div class="tg-item"><span class="tg-time">${escapeHtml((n.time||'').slice(11))}</span><span class="tg-title">${escapeHtml(n.title)}</span>${n.url?`<a href="${escapeHtml(n.url)}" target="_blank" rel="noopener" class="tg-link">原文</a>`:''}<button class="tg-gen" onclick="generateOneDraft(${i}, this)">✍️ 生成草稿</button></div>`
    ).join('');
  }catch(e){ $('telegraphList').innerHTML = '<div class="tg-item">快讯加载失败</div>'; }
}

function filterByStock(code, el){
  if(activeStock === code){ activeStock=''; document.querySelectorAll('.stock-card').forEach(c=>c.classList.remove('active')); }
  else { activeStock = code; document.querySelectorAll('.stock-card').forEach(c=>c.classList.remove('active')); if(el) el.classList.add('active'); }
  applyFilter();
}

/* 添加自选：搜索 */
let searchTimer = null;
$('stockInput').addEventListener('input', function(){
  clearTimeout(searchTimer);
  const q = this.value.trim();
  if(!q){ $('searchDropdown').classList.remove('show'); return; }
  searchTimer = setTimeout(async ()=>{
    try{
      const res = await fetch('/api/stocks/search?q='+encodeURIComponent(q));
      const list = await res.json();
      if(!Array.isArray(list)) return;
      $('searchDropdown').innerHTML = list.map(s=>`<div class="search-item" onclick="addStock('${s.code}')"><span class="sname">${escapeHtml(s.name)}</span><span class="scode">${s.code}</span></div>`).join('');
      $('searchDropdown').classList.add('show');
    }catch(e){}
  }, 250);
});
document.addEventListener('click', e=>{ if(!e.target.closest('.add-stock')) $('searchDropdown').classList.remove('show'); });

async function addStock(code){
  await fetch('/api/watchlist',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'add',code})});
  $('stockInput').value=''; $('searchDropdown').classList.remove('show');
  await loadWatchlist();
}
async function removeStock(code){
  await fetch('/api/watchlist',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'remove',code})});
  if(activeStock===code){ activeStock=''; }
  await loadWatchlist();
  applyFilter();
}

/* ---------- 新闻 ---------- */
async function loadNews(offset){
  const res = await fetch(`/api/news?limit=${PAGE}&offset=${offset}`);
  const news = await res.json();
  if(offset===0){ allNews=news; } else { allNews = allNews.concat(news); }
  newsOffset = offset + news.length;
  $('loadMore').style.display = news.length===PAGE ? 'block' : 'none';
  buildSourceFilter();
  applyFilter();
}
async function loadMore(){ await loadNews(newsOffset); }

function buildSourceFilter(){
  const sources = [...new Set(allNews.map(n=>n.source).filter(Boolean))].sort();
  const cur = $('srcSelect').value;
  $('srcSelect').innerHTML = '<option value="">全部来源</option>' + sources.map(s=>`<option value="${escapeHtml(s)}">${escapeHtml(s)}</option>`).join('');
  $('srcSelect').value = cur;
}

function applyFilter(){
  const kw = $('kwInput').value.trim().toLowerCase();
  const src = $('srcSelect').value;
  const stk = activeStock;
  let list = allNews.filter(n=>{
    if(stk && n.stock_code!==stk) return false;
    if(src && n.source!==src) return false;
    if(kw && !((n.title||'').toLowerCase().includes(kw) || (n.content||'').toLowerCase().includes(kw))) return false;
    return true;
  });
  renderNews(list);
}

function renderNews(list){
  const box = $('newsList');
  if(!list.length){
    box.innerHTML = `<div class="empty"><div class="big">📭</div>${allNews.length?'没有匹配的新闻':'还没有新闻，点右上角「刷新新闻」抓取，或先添加自选股'}</div>`;
    return;
  }
  box.innerHTML = list.map(n=>{
    const hasA = n.plain && n.sentiment;
    const sentiment = n.sentiment || '';
    return `<div class="news-card">
      <div class="news-top">
        <span class="stock-tag">${escapeHtml(n.stock_code)}</span>
        <div class="news-title">${escapeHtml(n.title)}</div>
      </div>
      <div class="news-meta">${escapeHtml(n.source||'')} · ${escapeHtml(n.publish_time||'')}${(n.url&&n.url.startsWith('http'))?` · <a href="${escapeHtml(n.url)}" target="_blank" rel="noopener">查看原文 ↗</a>`:''}</div>
      <div class="news-content" id="content-${n.id}">${escapeHtml(n.content||'')}</div>
      ${n.content&&n.content.length>60?`<button class="link-btn" onclick="toggleContent(${n.id})">展开/收起</button>`:''}
      <div class="news-actions">
        <button class="btn-analyze" id="btn-${n.id}" onclick="analyze(${n.id})">${hasA?'🔍 重新分析':'🔍 大白话分析'}</button>
        <button class="btn-debate" id="btnb-${n.id}" onclick="debate(${n.id})">⚖️ 深度辩论</button>
      </div>
      <div class="analysis ${hasA?'show':''}" id="ana-${n.id}">
        ${hasA?`<span class="sentiment-badge ${sentimentClass(sentiment)}">${sentiment}</span><div class="plain">${escapeHtml(n.plain)}</div>${n.impact?`<div class="impact"><b>对股价影响：</b>${escapeHtml(n.impact)}</div>`:''}`:''}
      </div>
      <div class="debate" id="deb-${n.id}"></div>
    </div>`;
  }).join('');
}
function toggleContent(id){ $('content-'+id).classList.toggle('expanded'); }

/* ---------- 分析 / 辩论 ---------- */
async function analyze(id){
  const btn=$('btn-'+id), ana=$('ana-'+id);
  btn.disabled=true; btn.textContent='⏳ 分析中...';
  ana.classList.add('show'); ana.innerHTML='<div style="color:var(--muted);font-size:13px;">正在调用 DeepSeek，约 5-10 秒...</div>';
  try{
    const res=await fetch('/api/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({news_id:id})});
    const d=await res.json();
    if(!d.ok){ ana.innerHTML=`<div style="color:var(--up);font-size:13px;">分析失败：${escapeHtml(d.message||'')}</div>`; return; }
    const s=d.sentiment||'中性';
    ana.innerHTML=`<span class="sentiment-badge ${sentimentClass(s)}">${s}</span><div class="plain">${escapeHtml(d.plain||'')}</div>${d.impact?`<div class="impact"><b>对股价影响：</b>${escapeHtml(d.impact)}</div>`:''}`;
    btn.textContent='🔍 重新分析';
  }catch(e){ ana.innerHTML=`<div style="color:var(--up);font-size:13px;">网络错误</div>`; }
  finally{ btn.disabled=false; }
}
async function debate(id){
  const btn=$('btnb-'+id), deb=$('deb-'+id);
  btn.disabled=true; btn.textContent='⏳ 辩论中...';
  deb.classList.add('show'); deb.innerHTML='<div style="color:var(--muted);font-size:13px;">正在组织多空辩论（3 次调用），约 15-30 秒...</div>';
  try{
    const res=await fetch('/api/debate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({news_id:id})});
    const d=await res.json();
    if(!d.ok){ deb.innerHTML=`<div style="color:var(--up);font-size:13px;">辩论失败：${escapeHtml(d.message||'')}</div>`; return; }
    const s=d.sentiment||'中性', a=d.action||'观望';
    deb.innerHTML=`<div class="bull"><div class="h">🐂 看多观点</div><div class="view">${escapeHtml(d.bull||'')}</div></div>
      <div class="bear"><div class="h">🐻 看空观点</div><div class="view">${escapeHtml(d.bear||'')}</div></div>
      <div class="verdict"><div class="h">🎯 投资经理裁决</div>
      <div><span class="sentiment-badge ${sentimentClass(s)}">${s}</span><span class="action-badge action-${a}">${a}</span></div>
      <div class="plain" style="margin-top:8px;">${escapeHtml(d.conclusion||'')}</div>
      ${d.impact?`<div class="impact" style="margin-top:6px;"><b>影响：</b>${escapeHtml(d.impact)}</div>`:''}</div>`;
    btn.textContent='⚖️ 重新辩论';
  }catch(e){ deb.innerHTML=`<div style="color:var(--up);font-size:13px;">网络错误</div>`; }
  finally{ btn.disabled=false; }
}

/* ---------- 刷新新闻 ---------- */
async function fetchNews(){
  const btn=$('btnFetch'); btn.disabled=true;
  const res=await fetch('/api/fetch',{method:'POST'});
  const d=await res.json();
  if(!d.ok){ setStatus(d.message||'抓取失败',false); btn.disabled=false; return; }
  setStatus(d.message+'...',true); await pollStatus(); btn.disabled=false;
}
async function pollStatus(){
  for(let i=0;i<150;i++){
    await new Promise(r=>setTimeout(r,2000));
    const res=await fetch('/api/status'); const st=await res.json();
    if(!st.fetching){ setStatus(st.message==='ok'?'抓取完成':('出错：'+st.message),false); loadNews(0); loadQuotes(); return; }
    setStatus('正在抓取新闻...',true);
  }
  setStatus('抓取超时',false); loadNews(0);
}
function setStatus(t,on){ $('statusText').textContent=t; $('statusDot').classList.toggle('active',on); }

/* ---------- 自动刷新新闻 ---------- */
let autoTimer = null;
function autoMins(){ return parseInt($('autoInterval').value) || 5; }
function toggleAutoRefresh(){
  const on = $('autoRefreshCheck').checked;
  localStorage.setItem('autoRefresh', on ? '1' : '0');
  if(on){ startAuto(); } else { stopAuto(); setStatus('自动刷新已关闭', false); }
}
function startAuto(){
  stopAuto();
  autoTimer = setInterval(silentFetch, autoMins() * 60000);
  setStatus(`自动刷新已开启（每 ${autoMins()} 分钟）`, false);
  silentFetch();
}
function stopAuto(){
  if(autoTimer){ clearInterval(autoTimer); autoTimer = null; }
}
function changeInterval(){
  if(autoTimer){ stopAuto(); autoTimer = setInterval(silentFetch, autoMins() * 60000); }
}
async function silentFetch(){
  try{
    const res = await fetch('/api/fetch', {method:'POST'});
    const d = await res.json();
    if(!d.ok){ return; }
    setStatus('自动抓取新闻中...', true);
    for(let i=0;i<40;i++){
      await new Promise(r=>setTimeout(r,3000));
      const st = await (await fetch('/api/status')).json();
      if(!st.fetching){ break; }
    }
    await loadNews(0);
    await loadQuotes();
    setStatus(`已更新 ${new Date().toLocaleTimeString()}`, false);
  }catch(e){ setStatus('自动刷新失败', false); }
}

/* ---------- K线 ---------- */
async function showKline(code,name){
  const nm = name || (quoteMap[code] ? quoteMap[code].name : '');
  $('klineTitle').textContent = nm ? `${nm} (${code})` : code;
  $('klineMask').classList.add('show');
  $('klineChart').innerHTML = '<div style="color:var(--muted);padding:80px 0;text-align:center;">加载K线中...</div>';
  try{
    const res = await fetch(`/api/kline?code=${encodeURIComponent(code)}&limit=180`);
    const data = await res.json();
    if(!Array.isArray(data) || !data.length){ $('klineChart').innerHTML='<div style="color:var(--muted);padding:80px 0;text-align:center;">无K线数据</div>'; return; }
    const dates = data.map(d=>d[0]);
    const kdata = data.map(d=>[d[1],d[2],d[3],d[4]]); // [open, close, low, high]
    if(!klineChart) klineChart = echarts.init($('klineChart'));
    klineChart.setOption({
      backgroundColor: 'transparent',
      grid: {left:50,right:20,top:20,bottom:30},
      tooltip: {trigger:'axis', axisPointer:{type:'cross'}},
      xAxis: {type:'category', data:dates, axisLine:{lineStyle:{color:'#999'}}, axisLabel:{color:'#999'}},
      yAxis: {scale:true, splitLine:{lineStyle:{color:'rgba(150,150,150,.15)'}}, axisLabel:{color:'#999'}},
      dataZoom: [{type:'inside',start:60,end:100}],
      series: [{
        type:'candlestick', data:kdata,
        itemStyle:{ color:'#e03131', color0:'#2f9e44', borderColor:'#e03131', borderColor0:'#2f9e44' }
      }]
    }, true);
  }catch(e){ $('klineChart').innerHTML='<div style="color:var(--muted);padding:80px 0;text-align:center;">K线加载失败</div>'; }
}
function closeKline(){ $('klineMask').classList.remove('show'); }

// 点击自选股卡片看K线（长按/双击？这里用卡片上新增的K线入口）
// 为卡片添加K线入口：重新渲染时绑定
window.addEventListener('resize', ()=>{ if(klineChart) klineChart.resize(); });

/* ---------- 标签页 + 草稿箱 ---------- */
function switchTab(name, btn){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  if(btn) btn.classList.add('active');
  $('tab-news').style.display = name==='news' ? '' : 'none';
  $('tab-drafts').style.display = name==='drafts' ? '' : 'none';
  if(name==='drafts') loadDrafts();
}

let telegraphData = [];
async function generateOneDraft(index, btn){
  const n = telegraphData[index];
  if(!n) return;
  btn.disabled = true;
  btn.textContent = '⏳ 生成中...';
  try{
    const res = await fetch('/api/generate-draft', {method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({id: n.id, title: n.title, content: n.content, url: n.url})});
    const d = await res.json();
    if(d.ok){
      setStatus('已生成一条草稿', false);
      loadDrafts();
      btn.textContent = '✅ 已生成';
      btn.disabled = true;
    }else{
      setStatus(d.message || '生成失败', false);
      btn.textContent = '✍️ 生成草稿';
      btn.disabled = false;
    }
  }catch(e){
    setStatus('生成失败', false);
    btn.textContent = '✍️ 生成草稿';
    btn.disabled = false;
  }
}

async function loadDrafts(){
  try{
    const res = await fetch('/api/drafts');
    const list = await res.json();
    const badge = $('draftBadge');
    badge.style.display = list.length ? '' : 'none';
    badge.textContent = list.length;
    if(!list.length){
      $('draftList').innerHTML = '<div class="empty"><div class="big">📝</div>还没有草稿，点「⚡ 立即生成」或打开「自动生成」</div>';
      return;
    }
    selectedDrafts.clear();
    $('selectAllCheck').checked = false;
    updateSelUI();
    $('draftList').innerHTML = list.map(d=>`
      <div class="draft-card">
        <div class="draft-head">
          <input type="checkbox" class="draft-check" id="chk-${d.id}" onchange="toggleSelect(${d.id}, this.checked)">
          <div class="draft-src">${escapeHtml(d.news_title || d.news_content || '')}${d.news_url?` <a href="${escapeHtml(d.news_url)}" target="_blank" rel="noopener">原文 ↗</a>`:''}</div>
          <div class="draft-actions">
            <button class="btn-small btn-copy" onclick="copyDraft(${d.id}, this)">复制</button>
            <button class="btn-small btn-del" onclick="deleteDraft(${d.id})">删除</button>
          </div>
        </div>
        <div class="draft-text" id="draft-text-${d.id}">${escapeHtml(d.generated_text || '')}</div>
      </div>`).join('');
  }catch(e){ $('draftList').innerHTML = '<div class="empty">草稿加载失败</div>'; }
}

async function copyDraft(id, btn){
  const text = $('draft-text-'+id).textContent;
  try{
    await navigator.clipboard.writeText(text);
    const old = btn.textContent;
    btn.textContent = '已复制';
    setTimeout(()=>btn.textContent=old, 1500);
  }catch(e){
    const range = document.createRange();
    range.selectNodeContents($('draft-text-'+id));
    const sel = window.getSelection();
    sel.removeAllRanges(); sel.addRange(range);
    document.execCommand('copy');
    sel.removeAllRanges();
    btn.textContent = '已复制';
    setTimeout(()=>btn.textContent='复制', 1500);
  }
}
async function deleteDraft(id){
  await fetch('/api/drafts/'+id, {method:'DELETE'});
  loadDrafts();
}

let selectedDrafts = new Set();
function toggleSelect(id, checked){
  if(checked) selectedDrafts.add(id); else selectedDrafts.delete(id);
  updateSelUI();
}
function toggleSelectAll(){
  const check = $('selectAllCheck').checked;
  document.querySelectorAll('.draft-check').forEach(cb => {
    cb.checked = check;
    const id = parseInt(cb.id.replace('chk-',''));
    if(check) selectedDrafts.add(id); else selectedDrafts.delete(id);
  });
  updateSelUI();
}
function updateSelUI(){
  const n = selectedDrafts.size;
  $('selCount').textContent = n;
  $('btnBatchDelete').style.display = n > 0 ? '' : 'none';
}
async function batchDelete(){
  if(!selectedDrafts.size) return;
  if(!confirm(`确定删除选中的 ${selectedDrafts.size} 条草稿吗？`)) return;
  await fetch('/api/drafts/batch-delete', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({ids:[...selectedDrafts]})});
  selectedDrafts.clear();
  $('selectAllCheck').checked = false;
  updateSelUI();
  loadDrafts();
}

/* ---------- 初始化 ---------- */
loadMarket();
loadWatchlist();
loadNews(0);
loadTelegraph();
loadDrafts();
setInterval(()=>{ loadMarket(); loadQuotes(); loadTelegraph(); }, 60000); // 每分钟刷新行情+快讯
if(localStorage.getItem('autoRefresh') === '1'){
  $('autoRefreshCheck').checked = true;
  startAuto();
}
</script>
